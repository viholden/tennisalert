name: Beventi Ticket Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force-send current status for both pages right now"
        required: false
        default: false
        type: boolean

concurrency:
  group: ticket-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-tickets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run ticket monitor
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          if [[ "${{ inputs.force }}" == "true" ]]; then
            python ticket_monitor.py --force
          else
            python ticket_monitor.py
          fi

      - name: Commit state if changed
        run: |
          if [[ -n "$(git status --porcelain state/ticket_seen_state.json 2>/dev/null)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/ticket_seen_state.json
            git commit -m "chore: update ticket monitor state"
            git push
          else
            echo "No state changes"
          fi
