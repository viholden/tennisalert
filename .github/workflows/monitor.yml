name: Vetstoria Appointment Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      send_all_now:
        description: "Send immediate alert for all currently matching programs"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  check-programs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run monitor
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          CHECK_TIMEOUT_SECONDS: "90"
        run: |
          if [[ "${{ inputs.send_all_now }}" == "true" ]]; then
            python vetstoria_monitor.py --send-all-now
            python barnes_noble_monitor.py --send-all-now
          else
            python vetstoria_monitor.py
            python barnes_noble_monitor.py
          fi

      - name: Commit state if changed
        run: |
          if [[ -n "$(git status --porcelain state/vetstoria_seen_state.json state/barnes_noble_inventory_state.json 2>/dev/null)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/vetstoria_seen_state.json
            git add state/barnes_noble_inventory_state.json
            git commit -m "chore: update appointment and inventory monitor state"
            git push
          else
            echo "No state changes"
          fi
