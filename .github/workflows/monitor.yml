name: USTA Tennis Monitor

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      send_all_now:
        description: "Send immediate alert for all currently matching programs"
        required: false
        default: false
        type: boolean
      use_playwright:
        description: "Install Playwright browser and allow the browser fallback (slow, use only for troubleshooting)"
        required: false
        default: false
        type: boolean

concurrency:
  group: tennis-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-programs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dateutil

      # Playwright + its browser download/apt install is the biggest time cost in this
      # workflow and is only needed as a last-resort fallback, so it is skipped by
      # default to stay well within the free Actions minutes quota.
      - name: Install Playwright (only if requested)
        if: ${{ inputs.use_playwright == true }}
        run: |
          pip install playwright==1.55.0
          playwright install --with-deps chromium

      - name: Run monitor
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          CHECK_TIMEOUT_SECONDS: "90"
          USE_PLAYWRIGHT_FALLBACK: ${{ (inputs.use_playwright == true) && '1' || '0' }}
        run: |
          if [[ "${{ inputs.send_all_now }}" == "true" ]]; then
            python monitor.py --send-all-now
          else
            python monitor.py
          fi

      - name: Commit state if changed
        run: |
          if [[ -n "$(git status --porcelain state/seen_programs.json 2>/dev/null)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/seen_programs.json
            git commit -m "chore: update tennis monitor state"
            git push
          else
            echo "No state changes"
          fi
